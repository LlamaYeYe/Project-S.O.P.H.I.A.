name: Replace main with Project_SOPHIA-main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-project-sophia-main.yml

permissions:
  contents: write

jobs:
  replace-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download v1.0.0 Project_SOPHIA-main package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             "https://github.com/LlamaYeYe/Project-S.O.P.H.I.A./releases/download/v1.0.0/Project_SOPHIA-main.zip"             -o /tmp/Project_SOPHIA-main.zip
          rm -rf /tmp/project_sophia_release
          mkdir -p /tmp/project_sophia_release
          unzip -q /tmp/Project_SOPHIA-main.zip -d /tmp/project_sophia_release
          echo "Archive contents:"
          find /tmp/project_sophia_release -maxdepth 2 -type f | head -40

      - name: Replace repository files
        shell: bash
        run: |
          set -euo pipefail
          src="/tmp/project_sophia_release"
          first_dir="$(find "$src" -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [ -n "$first_dir" ] && [ -f "$first_dir/metadata.json" ]; then
            src="$first_dir"
          fi
          test -f "$src/metadata.json"
          test -f "$src/APP.JS"
          test -f "$src/SOPHIA_ROUTER.JS"
          test -f "$src/SOPHIA_VOICE_ENGINE.JS"
          test -d "$src/assets"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$src"/. .
          git status --short

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes detected."
            exit 0
          fi
          git commit -m "Replace main repository with Project S.O.P.H.I.A. v1.0.0 package [skip ci]"
          git push origin HEAD:main
