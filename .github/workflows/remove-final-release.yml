name: Remove final Project S.O.P.H.I.A. release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-final-release.yml

permissions:
  contents: write

jobs:
  remove-release:
    runs-on: ubuntu-latest
    steps:
      - name: Remove v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.0.0 --repo LlamaYeYe/Project-S.O.P.H.I.A. --yes

      - name: Clean up workflow
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove temporary workflow file
        run: |
          rm -f .github/workflows/remove-final-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary release cleanup workflow [skip ci]"
          git push origin HEAD:main
