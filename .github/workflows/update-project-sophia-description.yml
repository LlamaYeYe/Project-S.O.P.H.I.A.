name: Update Project S.O.P.H.I.A. repository description

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-project-sophia-description.yml

permissions:
  contents: write

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Update repository description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH repos/LlamaYeYe/Project-S.O.P.H.I.A. \
            -f description='Companion voice framework for the Wand Company Pip-Boy 3000.'

      - name: Clean up workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/update-project-sophia-description.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary repository description workflow [skip ci]"
            git push origin HEAD:main
          fi
